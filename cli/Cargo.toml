[workspace]

[package]
name = "squads-multisig-cli"
version = "0.1.4"
edition = "2021"
description = "CLI for Squads Multisig Protocol"

[dependencies]
anchor-lang = "0.29.0"
clap = { version = "4.4.11", features = ["derive"] }
colored = "2.0.4"
dialoguer = "0.11.0"
dirs = "5.0.1"
eyre = "0.6.9"
futures = "0.3.29"
indicatif = "0.17.7"
serde = "1.0.193"
serde_json = "1.0.108"
solana-account-decoder = "1.16.21"
solana-address-lookup-table-program = "1.16.19"
solana-cli-config = "1.16.19"
solana-client = "1.16.19"
solana-program = "1.16.19"
solana-sdk = "1.16.19"
spl-associated-token-account = { version = "2.2.0", features = ["no-entrypoint"] }
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.2.0"
squads-multisig = { path = "../sdk/rs", version = "2.0.1" }
thiserror = "1.0.51"
tokio = { version = "1.35.1", features = ["full"] }
reqwest = { version = "0.11.18", features = ["blocking", "json"] }
base64 = "0.13.1"
bincode = "1.3.3"
